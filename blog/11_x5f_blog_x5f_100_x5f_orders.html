      <h1 class="title">Grocery App Par Pehla Order Kaise Laye? 0 Se 100 Orders/Day Tak Ka Practical Plan Karachi 2026</h1>
      <p class="lead">App bana liya, lekin download ke baad pehla order nahi aa raha? Karachi ke 73+ mart owners ka same problem hai. Yeh raha wohi 7-step system jis se humne North Nazimabad, Gulshan aur DHA ke stores ko 0 se 100 orders/day tak scale kiya — bina heavy ads ke.</p>

      <div class="highlight-box">
        <strong>Reality check:</strong> Grocery app fail nahi hota features ki wajah se, fail hota hai launch execution ki wajah se. Pehle 14 din me agar aap 3km radius me 500+ active installs aur daily 20+ orders nahi laaye, toh customer uninstall kar dega. Is liye pehla order 24 ghante me laana sabse zaruri hai.
      </div>

      <h2 class="h2">Karachi Ke Liye 7 Steps Jo Actually Kaam Karte Hain</h2>

      <div class="steps">
        <div class="step-box">
          <div class="step-num">01</div>
          <div>
            <h3 class="step-title">QR Code Bombing — Har Touchpoint Par QR <span class="badge-inline">Day 1 must</span></h3>
            <p class="step-text">Counter par tent card, har shopping bag par sticker, rider ki bike par, shutter par vinyl. <b>CTA: "Scan Karo — 2 Minute Me Grocery Ghar Par"</b>. Ek A4 sheet par 4 QR print karo, cost Rs.18. 200 bags = 200 free impressions daily. QR ko direct Play Store / App Store link par lagao, homepage par nahi.</p>
          </div>
        </div>

        <div class="step-box">
          <div class="step-num">02</div>
          <div>
            <h3 class="step-title">WhatsApp Broadcast — Apni Puraani Diary Ko Gold Banao</h3>
            <p class="step-text">Aapke register me 800-1200 numbers already hain. 3 broadcast lists banao (300 per list). Message: <b>"Assalam-o-Alaikum {Name} bhai, Al-Jannat Mart ab app par! Pehle order par Rs200 OFF — Code: WELCOME200. Link: martlink.app/aljannat"</b>. Roz 11AM se pehle bhejo, image ke saath. First 48 hours me 18-22% install rate milta hai Karachi me.</p>
          </div>
        </div>

        <div class="step-box">
          <div class="step-num">03</div>
          <div>
            <h3 class="step-title">Staff Incentive — Rs.20 Per Download Ka Magic</h3>
            <p class="step-text">Counter boy ko bolo: har customer ko app download karao, account banao. Har verified download par <b>Rs.20 cash same day</b>. Whiteboard par daily scoreboard lagao. Hamara average: ek staff 22 downloads/day nikaal deta hai. 3 staff = 60+ installs/day bina ad spend ke. Ye sabse underrated hack hai.</p>
          </div>
        </div>

        <div class="step-box">
          <div class="step-num">04</div>
          <div>
            <h3 class="step-title">First Order Discount — WELCOME200 (Rs.200 OFF on Rs.1500+)</h3>
            <p class="step-text"><b>WELCOME200</b> coupon banao — Rs.200 OFF, minimum Rs.1500. Loss nahi hai: Karachi me average basket Rs.2,850 hai, margin 12-15%. Aap customer ko Rs.200 de kar lifetime customer le rahe ho. MartLink app me auto-apply hota hai, user ko yaad rakhne ki zarurat nahi.</p>
            <ul class="tips">
              <li>Expiry: 7 din — urgency banegi</li>
              <li>One per device — misuse rokne ke liye</li>
              <li>Banner: "Pehla Order = Rs.200 Bachao"</li>
            </ul>
          </div>
        </div>

        <div class="step-box">
          <div class="step-num">05</div>
          <div>
            <h3 class="step-title">Referral System — Har Customer Ko Salesman Banao</h3>
            <p class="step-text"><b>"Dost ko bhejo, dono ko Rs.100"</b> — Referee ko Rs.100 OFF, Referrer ko Rs.100 wallet credit next order par. Karachi me referral se 34% orders aate hain jab aap 500 installs cross kar lete ho. WhatsApp status par referral link pin karao: <b>martlink.app/r/ALJANNAT</b>.</p>
          </div>
        </div>

        <div class="step-box">
          <div class="step-num">06</div>
          <div>
            <h3 class="step-title">Push Notification 11AM — Grocery Ka Golden Hour</h3>
            <p class="step-text">Karachi ki housewives 10:30AM - 12PM me sabse zyada order karti hain. Roz 11AM par ek hi push: <b>"Aaj ki deal: 5kg Atta + Oil = Rs.2350 — 2 ghante me delivery"</b>. MartLink me pre-scheduled calendar hai — 30 din ke pushes ek baar me set. CTR 8-11% aata hai agar offer real ho.</p>
          </div>
        </div>

        <div class="step-box">
          <div class="step-num">07</div>
          <div>
            <h3 class="step-title">Google My Business + 3km SEO — Aas Paas Ke Logon Ko Pakdo</h3>
            <p class="step-text"><b>3km focus:</b> GMB par "Grocery delivery in North Nazimabad", "Online Kiryana North Nazimabad Block H" jaise keywords se 3 posts/week. Photos me QR wala counter dikhao. "Order via App" button add karo. Hamare stores ko GMB se 14-19 installs/week free me milte hain — bina ads ke. Radius ke bahar ads mat chalao, paisa jalega.</p>
          </div>
        </div>
      </div>

      <div class="case-wrap">
        <div class="case-head">
          <div class="case-icon">✓</div>
          <div class="case-title">Real Case: Al-Jannat Mart — North Nazimabad Block H (Karachi)</div>
        </div>
        <p style="font-size:14.6px; margin:0; color:#4e3f31">Owner: Imran Bhai — 14 saal ka mart, pehle sirf walk-in. MartLink app launch 18 Dec 2025. Team 3 log, zero paid ads first 10 days.</p>
        <div class="case-grid">
          <div class="case-stat"><div class="k">Day 1-3</div><div class="v">38 downloads • 9 orders</div><div class="k" style="margin-top:6px; text-transform:none">QR + WhatsApp broadcast 420 contacts. Staff incentive start.</div></div>
          <div class="case-stat"><div class="k">Day 4-7</div><div class="v">112 downloads • 41 orders</div><div class="k" style="margin-top:6px; text-transform:none">WELCOME200 active. Referral ne 17 extra installs diye.</div></div>
          <div class="case-stat"><div class="k">Day 8-25</div><div class="v">489 installs • 87 orders/day avg</div><div class="k" style="margin-top:6px; text-transform:none">11AM push + GMB posts. Basket Rs.2,920. Repeat 62%.</div></div>
        </div>
        <div class="highlight-box" style="margin:16px 0 0">
          <strong>Imran Bhai ka feedback:</strong> "Pehle socha app kaun use karega? Lekin QR bag wale idea ne game badal diya. 3rd day pe 6 orders aaye, ab larkay bolte hain app wale orders pehle pack karo. GMB se bhi roz 3-4 naye customers aa rahe hain."
        </div>
      </div>

      <h2 class="h2">100 Orders/Day Par Scale Kaise Hota Hai?</h2>
      <p style="font-size:15px; color:#4e3f31">Jab aap 40-50 orders/day par ho, toh 2 cheezein add karo: (1) 3pm ka second push "Sham ki chai ke saath biscuits — 30 min delivery" (2) Rider ka "App delivery" T-shirt — branding se trust badhta hai. Ads tab chalao jab aapka repeat 45%+ ho — warna aap balti me paani bhar rahe ho jisme suraakh hai.</p>

      <div class="success-box">
        <h3>\uD83C\uDFAF MartLink 30-Day Done-For-You Launch Plan — Aapko Kya Milega</h3>
        <ul class="success-list">
          <li><b>Day 1-2:</b> App setup + Play Store / App Store publishing + WELCOME200 coupon live</li>
          <li><b>Day 3:</b> QR Kit — 100 bag stickers + 3 counter tent cards + 1 shutter vinyl design (print-ready)</li>
          <li><b>Day 4:</b> WhatsApp broadcast ke 5 ready templates (Urdu + English) + 3 broadcast list strategy</li>
          <li><b>Day 5:</b> Staff training — 45 min session, Rs.20 incentive tracker sheet + daily scoreboard</li>
          <li><b>Day 6-30:</b> Push notification calendar — 30 pre-written 11AM pushes, referral system config (Rs.100/Rs.100)</li>
          <li><b>Day 7 onwards:</b> GMB optimization — 3km keywords, 12 posts, app link button + review reply templates</li>
          <li><b>Daily:</b> Orders dashboard + low-stock alert + WhatsApp order backup</li>
        </ul>
      </div>

      <div class="divider"></div>

      <div class="cta-box">
        <div class="price-tag">\uD83D\uDD25 Karachi Launch Offer — Jan 2026 • Setup Rs.60,000 • Monthly Rs.15,000</div>
        <h3 class="cta-head">App Ready Hai? Pehla 100 Orders Ka Plan Hum Lagate Hain.</h3>
        <p class="cta-sub">Aap mart sambhalo, hum downloads aur pehle orders laate hain. 30 din me 100 orders/day ka execution — QR se le kar GMB tak. Agle 48 ghante me onboarding slot book karo, 14 din me pehla result.</p>

          <a class="btn-gold" href="https://wa.me/923001234567?text=Hi%20MartLink%2C%20Mujhe%2011.html%20wala%20100%20Orders%20Plan%20chahiye%20-%20Rs60k%20setup%20wala">WhatsApp Par Plan Book Karo →</a>
          <a class="btn-ghost" href="../blogs.html">← Saare Blogs Dekho</a>
        </div>
        <div style="margin-top:16px; font-size:12.5px; color:#b8a28a">✓ No hidden charges • ✓ Play Store + App Store included • ✓ WELCOME200 & referral auto-setup • ✓ 3km SEO included</div>
      </div>
